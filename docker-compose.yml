services:
  # 0. DATABASE: PostgreSQL self-hosted on the same VPS (no cloud database).
  # core-api reaches it on the Docker network as db:5432. The host port is bound to 127.0.0.1 only, for admin
  # work on the VPS itself (psql, pg_dump); it is never published on the public interface.
  db:
    image: postgres:15-alpine
    container_name: finance-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=finance_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - finance-network

  # 0b. CACHE: Redis holds only a cache of the statistics (dashboards, admin aggregates). PostgreSQL stays the source of
  # truth, and core-api reads it directly whenever Redis is down. No port is published, not even on 127.0.0.1: only the
  # containers of finance-network reach it (admin work: docker compose exec redis redis-cli). No persistence, so a
  # restart starts empty instead of serving entries older than the database. KEYS, FLUSHALL and FLUSHDB are disabled.
  redis:
    image: redis:8.10-alpine
    container_name: finance-redis
    user: redis
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory "$$REDIS_MAXMEMORY"
        --maxmemory-policy allkeys-lru
        --save ''
        --appendonly no
        --rename-command KEYS ''
        --rename-command FLUSHALL ''
        --rename-command FLUSHDB ''
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - REDIS_MAXMEMORY=${REDIS_MAXMEMORY:-128mb}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Keep it about 1.5 x REDIS_MAXMEMORY: Redis needs some memory beyond its dataset.
          memory: ${REDIS_MEMORY_LIMIT:-192M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - finance-network

  # 1. CORE BACKEND (Spring Boot Java)
  core-api:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: finance-core-api
    ports:
      - "8080:8080"
    env_file:           
      - ${DEPLOY_ENV_FILE:-.env}
    environment:
      - DB_URL=jdbc:postgresql://db:5432/finance_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      - PAYMENT_SECRET=${PAYMENT_SECRET}
      - PAYMENT_MOCK_GATEWAY_URL=${MOCK_GATEWAY_URL}
      - PAYMENT_WEBHOOK_URL=${PAYMENT_WEBHOOK_URL}
      - PAYMENT_VNPAY_SECRET=${VNPAY_SECRET}
      - PAYMENT_ZALOPAY_SECRET=${ZALOPAY_SECRET}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DATA_MINING_URL=http://data-mining-api:8000
      # Statistics cache (core-backend/src/main/resources/redis-cache.properties); the CACHE_* settings come from .env.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-mining-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - finance-network

  # 2. DATA MINING SERVICE (FastAPI & Donut)
  data-mining-api:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: finance-data-mining
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge

volumes:
  # All database data lives here and survives rebuilds and restarts. Never run "docker compose down -v": it deletes it.
  postgres_data: