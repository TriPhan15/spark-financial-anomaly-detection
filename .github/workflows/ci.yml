name: Microservices CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'core-backend/pom.xml'

      - name: Run backend tests
        run: cd core-backend && mvn -B clean test -Dtest=!CoreBackendApplicationTests

  mobile-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run mobile checks
        run: cd mobile-app && flutter pub get && flutter analyze && flutter test

  ai-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Run AI service tests
        run: cd ai-service && pip install -r requirements.txt && pytest test_main.py -v
  deploy:
    name: Deploy to AWS VPS
    runs-on: ubuntu-latest
    needs: [backend-ci, mobile-ci, ai-ci] 
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' 
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e

            # 1. Kiểm tra tồn tại thư mục project và file cấu hình mật
            cd ~/Deploy_Project || { echo "Lỗi: Thư mục Deploy_Project không tồn tại!"; exit 1; }
            if [ ! -f .env ]; then echo "Lỗi: Không tìm thấy file .env chứa biến môi trường!"; exit 1; fi
            
            # 2. Xóa sạch rác local và ép đồng bộ nhánh main
            git fetch --all
            git checkout -f main
            git reset --hard origin/main
          
            # 3. [TỐI ƯU TỐC ĐỘ] Build Image mới ngầm trong khi ứng dụng cũ vẫn chạy
            echo "Bắt đầu build Image mới..."
            sudo env DOCKER_BUILDKIT=1 docker compose build
            
            # 4. [MINIMAL DOWNTIME & NATIVE HEALTHCHECK] 
            # Cờ --wait tự động khóa luồng cho đến khi mọi service khởi động thành công và passing healthcheck.
            echo "Tráo đổi Container cũ sang mới và chờ hệ thống ổn định..."
            sudo docker compose up -d --wait --remove-orphans
            
            # 5. Dọn dẹp Image rác và Build Cache ngầm để bảo vệ tuyệt đối dung lượng AWS
            sudo docker image prune -f
            sudo docker builder prune -f
            
            echo "TOÀN BỘ HỆ THỐNG ĐÃ LÊN LIVE THÀNH CÔNG!"