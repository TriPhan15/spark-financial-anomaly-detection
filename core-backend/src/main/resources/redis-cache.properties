# Redis cache of the statistics endpoints. Loaded by Config/CacheConfig with the LOWEST precedence: environment variables
# and application.yml override every line. No secret belongs here: the password only ever comes from REDIS_PASSWORD.

# Connection. Inside docker-compose the host is the "redis" service, whose port is never published on the host.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# The most a slow or unreachable Redis can add to a request before the statistics are read from PostgreSQL instead.
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:500ms}
# Redis only holds a cache: no Spring Data Redis repositories, and a Redis outage does not turn the API's health DOWN.
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false

# Keys are <prefix>:<schema version>:<cache>:<key>. A blank prefix becomes ledgermind:<active Spring profiles>.
app.cache.key-prefix=${CACHE_KEY_PREFIX:}
# Upper bounds (a bare number means seconds): each entry lives between (100 - jitter) % and 100 % of its cache's TTL.
app.cache.ttl.user-dashboard=${CACHE_TTL_USER_DASHBOARD:45s}
app.cache.ttl.user-popular-vendors=${CACHE_TTL_USER_POPULAR_VENDORS:60s}
app.cache.ttl.admin-dashboard-summary=${CACHE_TTL_ADMIN_DASHBOARD_SUMMARY:45s}
app.cache.ttl.admin-top-spenders=${CACHE_TTL_ADMIN_TOP_SPENDERS:60s}
app.cache.ttl.admin-statistics=${CACHE_TTL_ADMIN_STATISTICS:60s}
app.cache.ttl-jitter-percent=${CACHE_TTL_JITTER_PERCENT:10}
