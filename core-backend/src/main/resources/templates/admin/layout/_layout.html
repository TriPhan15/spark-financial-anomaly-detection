<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main(title, content)">
<head>
    <meta charset="utf-8">
    <title th:text="${title}">Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header class="main-header bg-dark py-2">
    <nav class="navbar navbar-expand-lg navbar-dark container-fluid">
        <button class="navbar-toggler" type="button" id="sidebarToggle">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="ms-auto d-flex align-items-center">
            <button id="themeToggle" class="btn btn-sm btn-outline-light me-3">
                <i class="bi bi-moon"></i>
            </button>
            <a class="nav-link text-white fw-bold" href="/admin/logout">
                Đăng xuất <i class="bi bi-box-arrow-right ms-1"></i>
            </a>
        </div>
    </nav>
</header>

<div class="d-flex flex-grow-1">
    <aside class="sidebar bg-dark text-white" id="appSidebar" style="min-width: 250px; min-height: 100vh;">
        <div class="text-center mb-3 user-profile p-3 border-bottom border-secondary">
            <i class="fa-solid fa-user-shield fa-3x mb-2 text-primary"></i>
            <p class="mt-2 fw-bold text-uppercase user-name mb-0">Quản Trị Viên</p>
            <p class="text-muted small">Hệ thống Finance</p>
        </div>
        <ul class="nav flex-column sidebar-nav p-2">
            <li class="nav-item mb-1"><a class="nav-link text-white rounded" href="/admin/dashboard"><i class="bi bi-speedometer me-2"></i> Bảng điều khiển</a></li>
            <li class="nav-item mb-1"><a class="nav-link text-white rounded" href="/admin/categories"><i class="bi bi-tags me-2"></i> Quản lý Danh mục</a></li>
            <li class="nav-item mb-1"><a class="nav-link text-white rounded" href="/admin/subscriptions"><i class="bi bi-coin me-2"></i> Quản lý Gói Hội Viên</a></li>
            <li class="nav-item mb-1"><a class="nav-link text-white rounded" href="/admin/receipts"><i class="bi bi-receipt me-2"></i>Quản lý User & Hóa đơn AI</a></li>
            <li class="nav-item mb-1"><a class="nav-link text-white rounded" href="/admin/reviews"><i class="bi bi-star me-2"></i> Quản lý Đánh giá</a></li>
            <hr class="border-secondary">
            <li class="nav-item mb-1"><a class="nav-link text-white rounded" href="/admin/auditlog"><i class="bi bi-shield-lock me-2"></i> Nhật ký Hệ thống </a></li>
            <li class="nav-item mb-1"><a class="nav-link text-white rounded" href="/admin/backup"><i class="bi bi-database-down me-2"></i> Backup Dữ liệu </a></li>
        </ul>
    </aside>

    <main class="content flex-grow-1 p-4 bg-light">
        <div class="page-title mb-4 p-3 bg-white rounded shadow-sm border-start border-4 border-primary d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold" th:text="${title}">Tiêu đề trang</h4>
            <div id="clock" class="text-muted fw-bold"></div>
        </div>

        <div th:replace="${content}"></div>

        <footer class="text-center mt-5 text-muted small">
            <p class="mb-0"><b>© 2026 Đồ án Hệ thống Quản lý Tài chính </b></p>
        </footer>
    </main>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        function updateTime() {
            const now = new Date();
            const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
            const day = days[now.getDay()];
            const date = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById("clock").textContent = `${day}, ${date} - ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        const sidebarToggle = document.getElementById('sidebarToggle');
        const appSidebar = document.getElementById('appSidebar');
        if (sidebarToggle && appSidebar) {
            sidebarToggle.addEventListener('click', function() {
                appSidebar.classList.toggle('d-none');
            });
        }

        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const isDarkMode = localStorage.getItem('darkMode') === 'true';

        if (isDarkMode) {
            body.classList.add('bg-dark', 'text-light');
            themeToggle.innerHTML = '<i class="bi bi-sun"></i>';
        }

        themeToggle.addEventListener('click', function() {
            body.classList.toggle('bg-dark');
            body.classList.toggle('text-light');
            const isDark = body.classList.contains('bg-dark');
            localStorage.setItem('darkMode', isDark);
            themeToggle.innerHTML = isDark ? '<i class="bi bi-sun text-warning"></i>' : '<i class="bi bi-moon"></i>';
        });
    });
</script>
</body>
</html>
