<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập Quản trị viên - Finance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 950px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
        }

        .login-left {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .login-left::before {
            content: '';
            position: absolute;
            top: -50px; left: -50px; width: 250px; height: 250px;
            background: rgba(255,255,255,0.1); border-radius: 50%; z-index: -1;
        }
        .login-left::after {
            content: '';
            position: absolute;
            bottom: -80px; right: -50px; width: 200px; height: 200px;
            background: rgba(255,255,255,0.1); border-radius: 50%; z-index: -1;
        }

        .login-logo {
            width: 90px; height: 90px;
            background: rgba(255,255,255,0.15);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .login-right {
            padding: 60px 50px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .input-group {
            border-radius: 12px;
            overflow: hidden;
            background-color: #f8f9fa;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .input-group:focus-within {
            background-color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13,110,253,0.1);
        }

        .input-group-text {
            background-color: transparent;
            border: none;
            color: #6c757d;
            padding-left: 20px;
        }

        .form-control {
            background-color: transparent;
            border: none;
            padding: 15px 20px 15px 10px;
            font-size: 15px;
            font-weight: 500;
        }
        .form-control:focus {
            box-shadow: none;
            background-color: transparent;
        }

        .btn-login {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13,110,253,0.3);
        }

        .toggle-password {
            background: transparent;
            border: none;
            color: #adb5bd;
            padding-right: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .toggle-password:hover { color: #0d6efd; }
    </style>
</head>
<body>

<div class="login-wrapper row m-0">

    <div class="col-lg-5 d-none d-lg-flex login-left">
        <div class="login-logo">
            <i class="bi bi-shield-lock-fill display-4 text-white"></i>
        </div>
        <h2 class="fw-bold mb-3">Finance Admin</h2>
        <p class="text-white-50 fs-6 lh-lg mb-0">
            Hệ thống Quản lý Tài chính & Bóc tách Hóa đơn tự động qua AI.
            <br><br>
            <span class="small opacity-75">Bảo mật - Nhanh chóng - Chính xác</span>
        </p>
    </div>

    <div class="col-lg-7 login-right">
        <div class="mb-5 text-center text-lg-start">
            <h3 class="fw-bold text-dark mb-2">Chào mừng trở lại!</h3>
            <p class="text-muted">Vui lòng đăng nhập để truy cập trang quản trị.</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center rounded-3 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 me-3"></i>
            <div>Tài khoản hoặc mật khẩu không chính xác!</div>
        </div>

        <div th:if="${param.locked}" class="alert alert-warning d-flex align-items-center rounded-3 mb-4" role="alert">
            <i class="bi bi-shield-lock-fill fs-5 me-3"></i>
            <div>Phát hiện truy cập bất thường. Vui lòng thử lại sau 15 phút.</div>
        </div>

        <form action="/admin/login" method="POST">

            <div class="mb-4">
                <label class="form-label fw-bold text-muted small ms-1 mb-2">TÀI KHOẢN</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill fs-5"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Nhập ID hoặc Email quản trị" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center ms-1 mb-2">
                    <label class="form-label fw-bold text-muted small mb-0">MẬT KHẨU</label>
                    <a href="/admin/forgot-password" class="text-decoration-none small text-primary fw-semibold">Quên mật khẩu?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill fs-5"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    <button class="toggle-password" type="button" id="togglePassword">
                        <i class="bi bi-eye-slash-fill fs-5"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid mt-5">
                <button type="submit" class="btn btn-primary text-white btn-login">
                    ĐĂNG NHẬP HỆ THỐNG <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const icon = togglePassword.querySelector('i');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            icon.classList.toggle('bi-eye-slash-fill');
            icon.classList.toggle('bi-eye-fill');
            icon.classList.toggle('text-primary');
        });
    });
</script>
</body>
</html>
